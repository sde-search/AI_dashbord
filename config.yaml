model:
  provider: custom:ollama
  default: qwen3-hermes
  context_length: 65536
providers:
  polza:
    api: http://127.0.0.1:8084
    key_env: HERMES_CUSTOM_127_0_0_1_8090_API_KEY
    default_model: deepseek/deepseek-v4-flash-0731
    extra_body:
      provider:
        only:
          - "gmicloud/fp8"
          - "streamlake/fp8"
          - "venice"
          - "digitalocean"
        sort: "price"
  ollama:
    api: http://127.0.0.1:11435/v1
    api_key: ollama
    default_model: qwen3-hermes
    context_length: 65536
    transport: chat_completions
compression:
  enabled: true
  threshold: 0.35
auxiliary:
  compression:
    provider: polza
    model: deepseek/deepseek-v4-flash-0731
display:
  show_reasoning: false
delegation:
  model: deepseek/deepseek-v4-flash-0731
  provider: polza
  context_length: 64000
plugins:
  enabled: []
model_overrides:
  qwen3:
    8-flash-next-coder-iq1_m:
      context_length: 65536
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
_config_version: 42
custom_providers:
  - name: qwen3:8b
    base_url: http://localhost:11434/v1
    key_env: HERMES_CUSTOM_LOCALHOST_11434_API_KEY
    model: qwen3:8b
